name: Build and Obfuscate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false
        gradle-home-cache-includes: |
          caches
          notifications
          jdks
          wrapper
        gradle-home-cache-cleanup: true

    - name: Build common with Gradle
      run: .\gradlew :common:build --info
      timeout-minutes: 30
      continue-on-error: true

    - name: Build common retry
      if: failure()
      run: .\gradlew :common:build --info --refresh-dependencies
      timeout-minutes: 30

    - name: Build fabric with Gradle
      run: .\gradlew :fabric:build --info
      timeout-minutes: 30
      continue-on-error: true

    - name: Build fabric retry
      if: failure()
      run: .\gradlew :fabric:build --info --refresh-dependencies
      timeout-minutes: 30

    - name: Build neoforge with Gradle
      run: .\gradlew :neoforge:build --info
      timeout-minutes: 30
      continue-on-error: true

    - name: Build neoforge retry
      if: failure()
      run: .\gradlew :neoforge:build --info --refresh-dependencies
      timeout-minutes: 30

    - name: Copy Paths For Fabric
      run: .\gradlew :fabric:copyZkmLibs

    - name: Copy Paths For Neoforge
      run: .\gradlew :neoforge:copyZkmLibs

    - name: Names
      run: |
        python f2.py
      shell: cmd

    - name: Run ZKM Obfuscation For Fabric
      run: |
        cd "obf-workspace\ZKM-25.0.0-Cracked\ZKM 25.0.0"
        .\Script.bat
      shell: cmd

    - name: Run ZKM Obfuscation For Neoforge
      run: |
        cd "obf-workspace\ZKM-25.0.0-Cracked\ZKM 25.0.0"
        .\nScript.bat
      shell: cmd

    - name: Run MixinRename For Fabric
      run: |
        cd "obf-workspace\MixinRename"
        python MixinRename.py --jar "..\ZKM-25.0.0-Cracked\ZKM 25.0.0\sakura-26.1.2-2.1.3-rawobf.jar" --pkg dev.sakura.client.mixins dev.sakura.fabric.mixins --out sakura-fabric-26.1.2-2.1.3-obf.jar --configs fabric.mod.json sakura-refmap.json sakura.accesswidener sakura.mixins.json sakura.fabric.mixins.json --backup obf_backups
      shell: cmd

    - name: Run MixinRename For Neoforge
      run: |
        cd "obf-workspace\MixinRename"
        python MixinRename.py --jar "..\ZKM-25.0.0-Cracked\ZKM 25.0.0\sakura-26.1.2-2.1.3-nrawobf.jar" --pkg dev.sakura.client.mixins dev.sakura.neoforge.mixins --out sakura-neoforge-26.1.2-2.1.3-obf.jar --configs fabric.mod.json sakura-refmap.json sakura.accesswidener sakura.mixins.json sakura.neoforge.mixins.json --backup obf_backups
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sakura-zkm-post
        path: |
          obf-workspace\MixinRename\*.jar
